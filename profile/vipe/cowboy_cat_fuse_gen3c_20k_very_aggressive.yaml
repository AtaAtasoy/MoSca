fuse_name: cowboy_cat_gen3c_fuse_20k_very_aggressive

# Existing MoSca run to fuse
base_logdir: runs/cowboy_cat_original_scale/logs/cowboy_cat_vipe_fixed_scene_native_add3_20260401_153850
base_ws: runs/cowboy_cat_original_scale
base_fit_cfg: profile/vipe/cowboy_cat_fit_fixed_scene.yaml

# Fixed gen3c supervision sequence
fuse_sequence_name: cowboy_cat_gen3c
gen3c_rgb_dir: gen3c-prior/cowboy-cat-zoom-in-out/gen3c/output/rgb/frames
# gen3c_dynamic_mask_dir: gen3c-prior/cowboy-cat-zoom-in-out/gen3c/output/rgb/masks
gen3c_dynamic_mask_dir: null
gen3c_pose_path: gen3c-prior/cowboy-cat-zoom-in-out/gen3c/output/pose/normalized_nofilter.npz
gen3c_intrinsics_path: gen3c-prior/cowboy-cat-zoom-in-out/gen3c/output/intrinsics/normalized_nofilter.npz
gen3c_normalization_params: /dss/dssmcmlfs01/pn25pi/pn25pi-dss-0000/di35dov/monst3r/demo_tmp/vipe_results/121frames/cowboy-cat/scene/normalized_nofilter/normalization_params.json
gen3c_normalization_mode: normalized_to_raw

# Optional future prior workspace for depth/flow/TAP hooks.
# The current implementation keeps the gen3c branch RGB-only even if this is set.
gen3c_prior_ws: null

fuse_phase_name: fuse_gen3c
fuse_save_preview_renders: true
fuse_checkpoint_interval: 5000

fuse_anchor_weight: 1.0
fuse_gen3c_rgb_weight: 1.0
fuse_gen3c_rgb_ssim_lambda: 0.1

fuse_anchor_views_per_step: 1
fuse_gen3c_views_per_step: 1

# Stage 1: Appearance-only updates
fuse_stage1_steps: 0
# Step2: Conservative geometry updates at 0.25x
fuse_stage2_steps: 0
# Step3: Full geometry LR plus densify/prune/reset controls.
fuse_stage3_steps: 20000

fuse_stage2_geo_lr_scale: 0.25
fuse_stage2_node_lr_scale: 0.25
fuse_stage2_node_sigma_lr_scale: 0.25
fuse_stage3_geo_lr_scale: 1.0
fuse_stage3_node_lr_scale: 1.0
fuse_stage3_node_sigma_lr_scale: 1.0

fuse_use_decay: false
fuse_decay_start: 2000
fuse_geo_reg_start_steps: 0
fuse_skinning_corr_start_steps: 10000000000

# Very aggressive clone/prune schedule for a stronger ablation.
fuse_s_ctrl_densify_steps: 100
fuse_s_ctrl_prune_steps: 100
fuse_s_ctrl_reset_steps: 1500
fuse_s_ctrl_densify_max_grad: 0.0001
fuse_s_ctrl_densify_percent_dense: 0.04
fuse_s_ctrl_prune_opacity_th: 0.05
fuse_s_ctrl_reset_opacity: 0.01

fuse_d_ctrl_densify_steps: 100
fuse_d_ctrl_prune_steps: 100
fuse_d_ctrl_reset_steps: 750
fuse_d_ctrl_densify_max_grad: 0.00005
fuse_d_ctrl_densify_percent_dense: 0.04
fuse_d_ctrl_prune_opacity_th: 0.05
fuse_d_ctrl_reset_opacity: 0.01

fuse_viz_cheap_interval: 500
fuse_viz_skip_t: 1
fuse_viz_move_angle_deg: 10.0
